services:
  - type: web
    name: hospital-backend
    runtime: docker
    repo: https://github.com/mamme234/Ghimbi-Adventist-General-Hospital-.git
    plan: free
    region: 
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildCommand: docker build -t hospital-backend -f ./backend/Dockerfile ./backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://ghimbi-adventist-general-hospital-2.vercel.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMS_ACCOUNT_SID
        sync: false
      - key: SMS_AUTH_TOKEN
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PAYMENT_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    healthCheckPath: /health
    autoDeploy: true
    ignoredPaths:
      - .gitignore
      - README.md
      - .vscode/
      - .github/
      - docs/
      - tests/
      - .env.example
      - docker-compose.yml
    dockerCommand: npm start
