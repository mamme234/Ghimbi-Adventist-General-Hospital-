services:
  - type: web
    name: hospital-backend
    runtime: node
    repo: https://github.com/yourusername/hospital-management-system
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    preDeployCommand: |
      echo "Running pre-deploy tasks..."
      npm run render:predeploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: RUN_MIGRATIONS
        value: true
      - key: CREATE_INDEXES
        value: true
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMS_ACCOUNT_SID
        sync: false
      - key: SMS_AUTH_TOKEN
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PAYMENT_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    healthCheckPath: /health
    autoDeploy: true
    ignoredPaths:
      - .gitignore
      - README.md
      - .vscode/
      - .github/
      - docs/
      - tests/
      - .env.example
      - docker-compose.yml
      - Dockerfile
      - .dockerignore
