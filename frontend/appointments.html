<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Appointments — Ghimbi Hospital</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div data-include="/components/header.html"></div>
  <main class="container">
    <h1>Book an Appointment</h1>
    <form id="appointment-form" class="form">
      <label>Full name<input name="name" required></label>
      <label>Email<input type="email" name="email" required></label>
      <label>Department<select name="department"><option>General</option></select></label>
      <button type="submit" class="btn primary">Request</button>
    </form>
    <div id="appointment-msg" role="status"></div>
  </main>
  <div data-include="/components/footer.html"></div>
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script>
    document.getElementById('appointment-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      try{
        await window.api.post('/appointments', data);
        document.getElementById('appointment-msg').textContent = 'Request submitted';
      }catch(err){
        document.getElementById('appointment-msg').textContent = 'Error';
      }
    });
  </script>
</body>
</html>
