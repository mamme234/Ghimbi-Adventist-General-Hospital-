<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - Ghimbi Adventist General Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>
    <div class="login-page">
        <div class="login-bg-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>

        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo">
                        <img src="../images/logo.svg" alt="Ghimbi Adventist">
                        <span>Ghimbi <span>Adventist</span></span>
                    </div>
                    <h1>Patient Portal</h1>
                    <p>Access your health records and manage appointments</p>
                </div>

                <div style="text-align: center; margin: 10px 0; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;">
                    <p style="font-size: 13px; color: #64748b; margin: 0;">
                        <i class="fas fa-users" style="color: #1a6e3c;"></i> 
                        All patients use the same login
                    </p>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="emailInput" placeholder="Enter your email" value="patient@ghimbiadventist.org" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="passwordInput" placeholder="Enter your password" value="patient123" required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" checked>
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>

                    <div class="qr-login-section">
                        <p>Or sign in with QR Code</p>
                        <button type="button" class="qr-login-btn" onclick="openQRScanner()">
                            <i class="fas fa-qrcode"></i> Scan QR Code
                        </button>
                    </div>

                    <div class="login-footer">
                        <p>Don't have an account? <a href="#">Register Now</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="qr-scanner-modal" id="qrScannerModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeQRScanner()"><i class="fas fa-times"></i></button>
            <h3>Scan QR Code</h3>
            <p>Position the QR code in the camera frame</p>
            <video id="qrVideo" class="scanner-video" autoplay playsinline></video>
            <div class="scanner-controls">
                <button class="btn-primary" onclick="startQRScan()"><i class="fas fa-play"></i> Start Scanning</button>
                <button class="btn-secondary" onclick="stopQRScan()"><i class="fas fa-stop"></i> Stop</button>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('loginBtn');

            if (email === 'patient@ghimbiadventist.org' && password === 'patient123') {
                btn.classList.add('loading');
                btn.innerHTML = '<i class="fas fa-spinner"></i> Signing In...';
                btn.style.opacity = '0.7';
                
                setTimeout(() => {
                    window.location.href = 'patient-dashboard.html';
                }, 1500);
            } else {
                alert('❌ Invalid email or password. Please try again.');
            }
        });

        function openQRScanner() {
            document.getElementById('qrScannerModal').classList.add('active');
        }

        function closeQRScanner() {
            document.getElementById('qrScannerModal').classList.remove('active');
            stopQRScan();
        }

        function startQRScan() {
            const video = document.getElementById('qrVideo');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                })
                .catch(err => {
                    alert('Camera access denied. Please allow camera access.');
                });
        }

        function stopQRScan() {
            const video = document.getElementById('qrVideo');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
        }

        document.getElementById('qrScannerModal').addEventListener('click', function(e) {
            if (e.target === this) closeQRScanner();
        });

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
</body>
</html>
