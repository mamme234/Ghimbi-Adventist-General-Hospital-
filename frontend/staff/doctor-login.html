<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Ghimbi Adventist General Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>
    <div class="login-page">
        <div class="login-bg-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>

        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo">
                        <img src="../images/logo.svg" alt="Ghimbi Adventist">
                        <span>Ghimbi <span>Adventist</span></span>
                    </div>
                    <h1>Doctor Portal</h1>
                    <p>Select your account to login</p>
                </div>

                <!-- REAL DOCTORS LIST -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0;">
                    <!-- Doctor 1: Sumeya Ilyas -->
                    <div onclick="selectDoctor('sumeya@gmail.com', 'tuqe', 'Dr. Sumeya Ilyas', 'Cardiologist')" 
                         style="border: 2px solid #1a6e3c; border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; background: #f0fdf4;">
                        <img src="https://ui-avatars.com/api/?name=Sumeya+Ilyas&background=1a6e3c&color=fff&size=50" style="width: 50px; height: 50px; border-radius: 50%;">
                        <div style="font-weight: 700; font-size: 13px; margin-top: 5px;">Dr. Sumeya Ilyas</div>
                        <div style="font-size: 11px; color: #64748b;">Cardiologist</div>
                        <div style="font-size: 10px; color: #1a6e3c;">❤️ Cardiology</div>
                    </div>

                    <!-- Doctor 2: Ali Ukkasha -->
                    <div onclick="selectDoctor('ali@gmail.com', 'ali123', 'Dr. Ali Ukkasha', 'Neurologist')" 
                         style="border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px; text-align: center; cursor: pointer;">
                        <img src="https://ui-avatars.com/api/?name=Ali+Ukkasha&background=2563eb&color=fff&size=50" style="width: 50px; height: 50px; border-radius: 50%;">
                        <div style="font-weight: 700; font-size: 13px; margin-top: 5px;">Dr. Ali Ukkasha</div>
                        <div style="font-size: 11px; color: #64748b;">Neurologist</div>
                        <div style="font-size: 10px; color: #2563eb;">🧠 Neurology</div>
                    </div>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="emailInput" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="passwordInput" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" checked>
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>

                    <div class="login-footer">
                        <p style="font-size: 12px; color: #94a3b8; margin-top: 10px;">
                            <i class="fas fa-shield-alt" style="color: #1a6e3c;"></i> 
                            Secure login · Protected by 2FA
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // REAL Doctor Data
        const doctors = {
            'sumeya@gmail.com': { 
                name: 'Dr. Sumeya Ilyas', 
                password: 'tuqe', 
                specialty: 'Cardiologist',
                department: 'Cardiology'
            },
            'ali@gmail.com': { 
                name: 'Dr. Ali Ukkasha', 
                password: 'ali123', 
                specialty: 'Neurologist',
                department: 'Neurology'
            }
        };

        function selectDoctor(email, password, name, specialty) {
            document.getElementById('emailInput').value = email;
            document.getElementById('passwordInput').value = password;
            
            // Highlight selected doctor
            document.querySelectorAll('[onclick^="selectDoctor"]').forEach(el => {
                el.style.borderColor = '#e2e8f0';
                el.style.background = 'transparent';
            });
            event.currentTarget.style.borderColor = '#1a6e3c';
            event.currentTarget.style.background = '#f0fdf4';
        }

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('loginBtn');

            // Check if doctor exists
            if (doctors[email] && doctors[email].password === password) {
                btn.classList.add('loading');
                btn.innerHTML = '<i class="fas fa-spinner"></i> Signing In...';
                btn.style.opacity = '0.7';
                
                // Store doctor info in session
                sessionStorage.setItem('doctorName', doctors[email].name);
                sessionStorage.setItem('doctorEmail', email);
                sessionStorage.setItem('doctorSpecialty', doctors[email].specialty);
                sessionStorage.setItem('doctorDepartment', doctors[email].department);
                
                setTimeout(() => {
                    window.location.href = 'doctor-dashboard.html';
                }, 1500);
            } else {
                alert('❌ Invalid email or password. Please try again.');
            }
        });

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
</body>
                            </html>
