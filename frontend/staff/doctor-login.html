<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - MediCare Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-bg-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>

        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo">
                        <img src="../images/logo.svg" alt="MediCare Hospital">
                        <span>Medi<span>Care</span></span>
                    </div>
                    <h1>Doctor Portal</h1>
                    <p>Access your patient queue and medical records</p>
                </div>

                <div class="role-selector">
                    <div class="role-option" data-role="patient">
                        <i class="fas fa-user"></i>
                        <span>Patient</span>
                    </div>
                    <div class="role-option active" data-role="doctor">
                        <i class="fas fa-user-md"></i>
                        <span>Doctor</span>
                    </div>
                    <div class="role-option" data-role="admin">
                        <i class="fas fa-user-cog"></i>
                        <span>Admin</span>
                    </div>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="emailInput" placeholder="Enter your email" value="doctor@medicare.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="passwordInput" placeholder="Enter your password" value="doctor123" required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" checked>
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Sign In as Doctor
                    </button>

                    <div class="login-footer">
                        <p>Need access? <a href="#">Contact IT Support</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.querySelectorAll('.role-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                const role = this.dataset.role;
                const btn = document.getElementById('loginBtn');
                if (role === 'doctor') {
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In as Doctor';
                } else if (role === 'patient') {
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In as Patient';
                } else {
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In as Admin';
                }
            });
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i> Signing In...';
            setTimeout(() => {
                window.location.href = 'doctor-dashboard.html';
            }, 1500);
        });

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
</body>
                          </html>
