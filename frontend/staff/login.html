<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Staff Login - Access hospital management dashboard">
    <title>Staff Login - Gimbi Adventist General Hospital</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="manifest" href="../manifest.json">
</head>
<body class="login-page">
    <div id="preloader">
        <div class="loader">
            <div class="heart-pulse"></div>
            <span class="loader-text">Loading...</span>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card glass fade-up">
            <div class="login-header">
                <a href="../index.html" class="login-logo">
                    <img src="../assets/logo.svg" alt="Gimbi Adventist Hospital">
                </a>
                <div class="role-badge staff-badge">
                    <i class="fas fa-stethoscope"></i> Staff Portal
                </div>
                <h1>Staff Login</h1>
                <p>Access your departmental dashboard</p>
            </div>

            <form id="staffLoginForm" class="login-form">
                <div class="form-group">
                    <label for="staffEmail"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="staffEmail" class="input" placeholder="Enter your work email" required>
                </div>

                <div class="form-group">
                    <label for="staffPassword"><i class="fas fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="staffPassword" class="input" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('staffPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="staffRole"><i class="fas fa-user-tag"></i> Department / Role</label>
                    <select id="staffRole" class="select" required>
                        <option value="">Select Your Role</option>
                        <option value="doctor">Doctor</option>
                        <option value="doctor-assistant">Doctor Assistant</option>
                        <option value="nurse">Nurse</option>
                        <option value="receptionist">Receptionist</option>
                        <option value="pharmacist">Pharmacist</option>
                        <option value="laboratory">Laboratory Technician</option>
                        <option value="radiology">Radiologist</option>
                        <option value="finance">Finance Officer</option>
                        <option value="hr">HR Officer</option>
                        <option value="ambulance">Ambulance Staff</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="staffRemember">
                        <span>Remember me</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div class="login-footer">
                    <p class="back-link"><a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.parentElement.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.getElementById('staffLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const role = document.getElementById('staffRole').value;
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
            btn.disabled = true;

            // Redirect based on role
            setTimeout(() => {
                const roleMap = {
                    'doctor': '../staff/doctor/dashboard.html',
                    'doctor-assistant': '../staff/doctor-assistant/dashboard.html',
                    'nurse': '../staff/nurse/dashboard.html',
                    'receptionist': '../staff/receptionist/dashboard.html',
                    'pharmacist': '../staff/pharmacist/dashboard.html',
                    'laboratory': '../staff/laboratory/dashboard.html',
                    'radiology': '../staff/radiology/dashboard.html',
                    'finance': '../staff/finance/dashboard.html',
                    'hr': '../staff/hr/dashboard.html',
                    'ambulance': '../staff/ambulance/dashboard.html',
                    'admin': '../admin/dashboard.html'
                };
                window.location.href = roleMap[role] || '../index.html';
            }, 1500);
        });
    </script>

    <style>
        .login-page {
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }
        .login-card {
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo img {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .staff-badge {
            background: var(--primary-gradient);
            color: white;
        }
        .login-header h1 {
            font-family: var(--font-primary);
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .input {
            padding-right: 48px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }
        .toggle-password:hover {
            color: var(--text-primary);
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 24px;
        }
        .forgot-link {
            color: var(--primary);
            font-size: 14px;
            text-decoration: none;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }
        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
        }
        .back-link a:hover {
            color: var(--text-primary);
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 24px 16px;
            }
        }
    </style>
</body>
                  </html>
