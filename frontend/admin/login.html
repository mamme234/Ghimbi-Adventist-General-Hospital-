<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Login - System Administration">
    <title>Admin Login - Gimbi Adventist General Hospital</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="manifest" href="../manifest.json">
</head>
<body class="login-page">
    <div id="preloader">
        <div class="loader">
            <div class="heart-pulse"></div>
            <span class="loader-text">Loading...</span>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card glass fade-up">
            <div class="login-header">
                <a href="../index.html" class="login-logo">
                    <img src="../assets/logo.svg" alt="Gimbi Adventist Hospital">
                </a>
                <div class="role-badge admin-badge">
                    <i class="fas fa-user-shield"></i> Admin Portal
                </div>
                <h1>Administrator Login</h1>
                <p>System administration and management dashboard</p>
            </div>

            <form id="adminLoginForm" class="login-form">
                <div class="form-group">
                    <label for="adminEmail"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="adminEmail" class="input" placeholder="Enter your admin email" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword"><i class="fas fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="adminPassword" class="input" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('adminPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="adminRole"><i class="fas fa-user-tag"></i> Admin Level</label>
                    <select id="adminRole" class="select" required>
                        <option value="">Select Admin Level</option>
                        <option value="super-admin">Super Administrator</option>
                        <option value="admin">Hospital Administrator</option>
                    </select>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="adminRemember">
                        <span>Remember me</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div class="login-footer">
                    <p class="back-link"><a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home</a></p>
                </div>
            </form>

            <div class="security-notice">
                <i class="fas fa-shield-alt"></i>
                <span>This is a secure area. All access is logged and monitored.</span>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.parentElement.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const role = document.getElementById('adminRole').value;
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
            btn.disabled = true;

            setTimeout(() => {
                const roleMap = {
                    'super-admin': 'dashboard.html',
                    'admin': 'dashboard.html'
                };
                window.location.href = roleMap[role] || 'dashboard.html';
            }, 1500);
        });
    </script>

    <style>
        .login-page {
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }
        .login-card {
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo img {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .admin-badge {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
        }
        .login-header h1 {
            font-family: var(--font-primary);
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .input {
            padding-right: 48px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }
        .toggle-password:hover {
            color: var(--text-primary);
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 24px;
        }
        .forgot-link {
            color: var(--primary);
            font-size: 14px;
            text-decoration: none;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }
        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
        }
        .back-link a:hover {
            color: var(--text-primary);
        }
        .security-notice {
            margin-top: 20px;
            padding: 12px 16px;
            background: rgba(108, 92, 231, 0.08);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .security-notice i {
            color: #6c5ce7;
            font-size: 16px;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 24px 16px;
            }
        }
    </style>
</body>
  </html>
